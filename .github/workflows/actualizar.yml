name: Actualizar tabla

on:
  schedule:
    # cada 3 horas. Los partidos son de viernes a lunes, no hace falta mas.
    - cron: "0 */3 * * *"
  workflow_dispatch:        # boton para correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar y validar la tabla
        id: correr
        continue-on-error: true      # que falle el scraper no debe romper el repo
        run: python scraper/actualizar.py

      - name: Publicar cambios
        run: |
          git config user.name  "bot-llave"
          git config user.email "bot@users.noreply.github.com"
          # si el scraper fallo, data.json puede no existir todavia:
          # agregamos solo lo que este, para que el estado igual llegue al repo
          for f in data.json estado.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "tabla: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Avisar si la validacion fallo
        if: steps.correr.outcome == 'failure'
        run: |
          echo "::warning::El scraper no pudo actualizar. data.json quedo como

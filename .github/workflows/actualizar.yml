name: Actualizar tabla

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar y validar la tabla
        id: correr
        continue-on-error: true
        run: python scraper/actualizar.py

      - name: Publicar cambios
        run: |
          git config user.name "bot-llave"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json estado.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "tabla actualizada"
            git push
          fi

      - name: Mostrar el motivo si fallo
        if: steps.correr.outcome == 'failure'
        run: cat estado.json || echo "sin estado.json"
